name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Primero: análisis, pruebas y compilación debug. Si falla, no se publica nada.
  verificar:
    uses: ./.github/workflows/verificacion.yml

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Clave de firma
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS del repositorio"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/nexlia.keystore

      - name: Compilar
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk NEXLIA.apk

      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs NEXLIA.apk | tee firma.txt
          grep -qi "e0735399159692c453a3ffbdd4c695a9bafc289cc1f19c89743cb298942d6394" firma.txt || { echo "La firma no es la esperada"; exit 1; }

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEXLIA 1.0.${{ github.run_number }}
          files: NEXLIA.apk
