name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Armar el proyecto Flutter
        run: |
          mkdir app && cd app
          flutter create --org com.nexlia --project-name phone --platforms android .
          flutter pub add video_player
          cp -r ../lib/* lib/
          cp ../android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/nexlia/phone
          cp ../android/kotlin/*.kt android/app/src/main/kotlin/com/nexlia/phone/
          cp -r ../android/res/* android/app/src/main/res/
          mkdir -p assets && cp ../assets/* assets/
          sed -i 's|^  uses-material-design: true|  uses-material-design: true\n  assets:\n    - assets/icon.png|' pubspec.yaml
          rm -f test/widget_test.dart
          sed -i 's/flutter\.minSdkVersion/29/' android/app/build.gradle*
          # Firma fija y privada: la clave vive en los secretos del repositorio.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Faltan los secretos KEYSTORE_B64 y KEYSTORE_PASS del repositorio"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/nexlia.keystore
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts <<'KTS'

          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("nexlia.keystore")
                      storePassword = System.getenv("KEYSTORE_PASS")
                      keyAlias = "nexlia"
                      keyPassword = System.getenv("KEYSTORE_PASS")
                  }
              }
          }
          KTS
          else
            cat >> android/app/build.gradle <<'GROOVY'

          android {
              signingConfigs {
                  debug {
                      storeFile file("nexlia.keystore")
                      storePassword System.getenv("KEYSTORE_PASS")
                      keyAlias "nexlia"
                      keyPassword System.getenv("KEYSTORE_PASS")
                  }
              }
          }
          GROOVY
          fi

      - name: Compilar
        working-directory: app
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk ../NEXLIA.apk

      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs NEXLIA.apk | tee firma.txt
          grep -qi "e0735399159692c453a3ffbdd4c695a9bafc289cc1f19c89743cb298942d6394" firma.txt || { echo "La firma no es la esperada"; exit 1; }

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEXLIA 1.0.${{ github.run_number }}
          files: NEXLIA.apk
