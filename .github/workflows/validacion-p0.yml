# Validación de la integración P0. Solo en la rama temporal tmp/validacion-p0.
# NO crea Release: el APK queda como artefacto de esta ejecución.
name: Validación integración P0 (no publica)

on:
  push:
    branches: [tmp/validacion-p0]

permissions:
  contents: read

jobs:
  verificar:
    uses: ./.github/workflows/verificacion.yml

  analisis-sin-opciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
      - name: flutter analyze (sin opciones) y git diff --check
        run: |
          flutter pub get --enforce-lockfile
          set +e
          flutter analyze; code=$?
          set -e
          echo "RESULTADO flutter analyze sin opciones: exit=$code"
          git diff --check origin/main...HEAD && echo "RESULTADO git diff --check: sin problemas"

  apk:
    needs: [verificar, analisis-sin-opciones]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Compilar release con la clave de producción
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then echo "Faltan los secretos de firma"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/nexlia.keystore
          flutter pub get --enforce-lockfile
          # versionCode 13: se instala encima de v1.0.13; la próxima oficial (14+) se instala encima de esta.
          flutter build apk --release --build-name=1.0.13-validacion-p0 --build-number=13
          rm -f android/app/nexlia.keystore
          mkdir out
          cp build/app/outputs/flutter-apk/app-release.apk out/NEXLIA-validacion-P0.apk
          cp ci/INSTRUCCIONES.txt out/

      - name: Firma, paquete, versión, permisos y SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          gh release download v1.0.13 -R ${{ github.repository }} -p NEXLIA.apk -O v13.apk
          cd out
          $BT/apksigner verify --verbose --print-certs NEXLIA-validacion-P0.apk | tee firma.txt
          nuevo=$(grep "certificate SHA-256 digest" firma.txt | head -1 | sed 's/.*digest: //')
          prod=$($BT/apksigner verify --print-certs ../v13.apk | grep "certificate SHA-256 digest" | head -1 | sed 's/.*digest: //')
          echo "Certificado validación: $nuevo"; echo "Certificado v1.0.13:    $prod"
          [ "$nuevo" = "$prod" ] && [ "$nuevo" = "e0735399159692c453a3ffbdd4c695a9bafc289cc1f19c89743cb298942d6394" ] \
            && echo "RESULTADO firma: misma clave de producción que v1.0.13" || { echo "RESULTADO firma: DISTINTA"; exit 1; }
          $BT/aapt2 dump badging NEXLIA-validacion-P0.apk | grep -E "^package:|^minSdkVersion|^targetSdkVersion" | tee version.txt
          $BT/aapt2 dump badging ../v13.apk | grep -E "^package:" | sed 's/^/v1.0.13: /' | tee -a version.txt
          grep -q "name='com.nexlia.phone' versionCode='13'" version.txt && echo "RESULTADO paquete y versionCode: OK"
          $BT/aapt2 dump permissions NEXLIA-validacion-P0.apk | sort > permisos.txt
          $BT/aapt2 dump permissions ../v13.apk | sort > ../permisos_v13.txt
          cat permisos.txt
          diff ../permisos_v13.txt permisos.txt && echo "RESULTADO permisos: idénticos a v1.0.13"
          sha256sum NEXLIA-validacion-P0.apk | tee NEXLIA-validacion-P0.apk.sha256
          echo "commit: $GITHUB_SHA (integracion/p0 + este flujo)" >> version.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: NEXLIA-validacion-P0
          path: out/
          retention-days: 30
          if-no-files-found: error

  emulador:
    needs: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
        # validacion = APK P0 instalado encima de v1.0.13; control = solo v1.0.13 (para separar
        # regresiones de limitaciones del emulador).
        build: [validacion, control]
    name: emulador (API ${{ matrix.api-level }}, ${{ matrix.build }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NEXLIA-validacion-P0
          path: apk
      - name: v1.0.13 publicada y SHA-256 del artefacto descargado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.13 -R ${{ github.repository }} -p NEXLIA.apk -O v13.apk
          cd apk && sha256sum -c NEXLIA-validacion-P0.apk.sha256
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pruebas funcionales en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ci/validacion_emulador.sh ${{ matrix.build == 'control' && 'control' || 'apk/NEXLIA-validacion-P0.apk' }}
