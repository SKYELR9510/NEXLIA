    <rect x="122" y="-8" width="170" height="150" rx="52" fill="#FFFFFF" transform="rotate(14 207 67)"/>
  </g>
  <!-- escudo del bloqueador -->
  <g transform="translate(716 706) scale(0.92)">
    <path d="M 0 -150 L 122 -104 V -6 C 122 76 68 132 0 160 C -68 132 -122 76 -122 -6 V -104 Z"
